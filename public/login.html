<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Texas Winners</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/texas.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-texas">
    <div class="container">
        <a class="navbar-brand brand-text" href="index.html">
            <i class="fas fa-star me-2"></i>Texas Winners
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <i class="fas fa-bars text-white fs-4"></i>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="link2play.html">Play Games</a></li>
                <li class="nav-item"><a class="nav-link" href="deposit.html">Deposit</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item" id="authNav"></li>
                <li class="nav-item"><a class="nav-link" href="#" id="logoutLink" style="display:none;"><i class="fas fa-right-from-bracket me-1"></i>Log Out</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Login Section -->
<section class="deposit-section" style="min-height: 80vh;">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-right-to-bracket me-2" style="font-size: 0.7em;"></i> Log In</h2>
        <p class="section-subtitle">Welcome back, partner</p>

        <div class="deposit-form-card" style="max-width: 480px; margin: 0 auto;">
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="loginEmail">
                        <i class="fas fa-envelope me-1"></i> Email
                    </label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="loginPassword">
                        <i class="fas fa-lock me-1"></i> Password
                    </label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn-texas w-100 text-center" id="loginBtn">
                    <i class="fas fa-right-to-bracket me-2"></i>Log In
                </button>
            </form>
            <div id="loginError" class="mt-3 p-3 rounded" style="display:none; background: rgba(191,10,48,0.2); border: 1px solid var(--tx-red); color: #ff6b6b;"></div>
            <p class="text-center mt-3" style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">
                No account yet? <a href="signup.html" style="color: var(--tx-gold);">Create one here</a>.
            </p>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer-texas">
    <div class="container">
        <div class="footer-bottom text-center">
            <p>&copy; 2024 Texas Winners. All rights reserved. | Must be 18+ to play.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
