<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Texas Winners</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/texas.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-texas">
    <div class="container">
        <a class="navbar-brand brand-text" href="index.html">
            <i class="fas fa-star me-2"></i>Texas Winners
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <i class="fas fa-bars text-white fs-4"></i>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="link2play.html">Play Games</a></li>
                <li class="nav-item"><a class="nav-link" href="deposit.html">Deposit</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Signup Section -->
<section class="deposit-section" style="min-height: 80vh;">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-user-plus me-2" style="font-size: 0.7em;"></i> Create Account</h2>
        <p class="section-subtitle">Join the Texas Winners family</p>

        <div class="deposit-form-card">
            <form id="signupForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="firstName">
                            <i class="fas fa-user me-1"></i> First Name
                        </label>
                        <input type="text" class="form-control" id="firstName" placeholder="First name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="lastName">
                            <i class="fas fa-user me-1"></i> Last Name
                        </label>
                        <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="signupEmail">
                            <i class="fas fa-envelope me-1"></i> Email
                        </label>
                        <input type="email" class="form-control" id="signupEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="signupPhone">
                            <i class="fas fa-phone me-1"></i> Phone Number
                        </label>
                        <input type="tel" class="form-control" id="signupPhone" placeholder="(555) 123-4567" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="preferredGame">
                            <i class="fas fa-gamepad me-1"></i> Preferred Game Platform
                        </label>
                        <select class="form-control" id="preferredGame">
                            <option value="">Select a game...</option>
                            <option value="juwa">Juwa</option>
                            <option value="orion">Orion Stars</option>
                            <option value="firekirin">Fire Kirin</option>
                            <option value="gamevault">Game Vault</option>
                            <option value="milkyway">Milky Way</option>
                            <option value="vegasx">Vegas X</option>
                            <option value="panda">Panda Master</option>
                            <option value="ultra">Ultra Panda</option>
                            <option value="vblink">VBLink</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check" style="color: rgba(255,255,255,0.7);">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label" for="termsCheck">
                                I am 18+ years old and agree to the platform rules
                            </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn-texas w-100 text-center">
                            <i class="fas fa-star me-2"></i>Create My Account
                        </button>
                    </div>
                </div>
            </form>
            <div id="signupSuccess" class="mt-3 p-3 rounded text-center" style="display:none; background: rgba(76,175,80,0.2); border: 1px solid #4CAF50; color: #4CAF50;">
                <i class="fas fa-check-circle me-1"></i> Account request submitted! Check your email for confirmation.
            </div>
            <p class="text-center mt-3" style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">
                Already have an account? Contact support for login help.
            </p>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer-texas">
    <div class="container">
        <div class="footer-bottom text-center">
            <p>&copy; 2024 Texas Winners. All rights reserved. | Must be 18+ to play.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    this.style.display = 'none';
    document.getElementById('signupSuccess').style.display = 'block';
});
</script>
</body>
</html>
